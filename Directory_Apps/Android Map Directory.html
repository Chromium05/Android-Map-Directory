<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Android Map Directory — Main + Style Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="home-screen.jsx"></script>
  <script type="text/babel" src="map-screen.jsx"></script>
  <script type="text/babel" src="detail-screen.jsx"></script>
  <script type="text/babel" src="info-screen.jsx"></script>
  <script type="text/babel" src="style-guide.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { HomeScreen, MapScreen, DetailScreen, InfoScreen, StyleGuide,
            DesignCanvas, DCSection, DCArtboard } = window;

    function App() {
      return (
        <DesignCanvas
          title="Android Map Directory"
          subtitle="Direktori unit kampus — main · map · detail · style guide"
        >
          <DCSection
            id="screens"
            title="Screens"
            subtitle="Home → Peta → Detail. Fokus: unit kampus dengan gedung + lantai."
          >
            <DCArtboard id="home"   label="01 · Beranda"  width={380} height={780}>
              <HomeScreen/>
            </DCArtboard>
            <DCArtboard id="map"    label="02 · Peta"     width={380} height={780}>
              <MapScreen/>
            </DCArtboard>
            <DCArtboard id="detail" label="03 · Detail"   width={380} height={780}>
              <DetailScreen/>
            </DCArtboard>
            <DCArtboard id="info"   label="04 · Info"     width={380} height={780}>
              <InfoScreen/>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="guide"
            title="Style guide"
            subtitle="Color · Typography · Iconography · Components · Spacing · Voice"
          >
            <DCArtboard id="styleguide" label="Style Guide · v1.0" width={760} height={2200}>
              <StyleGuide/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
